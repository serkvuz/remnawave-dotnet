name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Verify generated client is up to date
        run: |
          ./scripts/generate.sh
          if ! git diff --quiet; then
            echo "::error::Generated code is out of date. Run ./scripts/generate.sh and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Test against the netstandard2.0 and net8.0 builds
        run: |
          for tfm in netstandard2.0 net8.0; do
            dotnet test tests/Remnawave.Client.Tests -c Release -p:LibraryTargetFramework=$tfm
          done

      - name: Native AOT check (sample must publish without IL warnings)
        run: dotnet publish samples/Remnawave.Client.Sample -c Release -r linux-x64 -o artifacts/aot

      - name: Pack
        run: dotnet pack src/Remnawave.Client -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
