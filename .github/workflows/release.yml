name: Release

# Push a tag to publish: v<remnawave-api-version>[.<revision>], e.g. v3.4.10 or v3.4.10.1 for a client-only fix.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          API_VERSION="$(cat spec/VERSION)"
          case "$VERSION" in
            "$API_VERSION"|"$API_VERSION".*|"$API_VERSION"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match spec/VERSION ($API_VERSION)"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/Remnawave.Client -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/packages/* --generate-notes --title "Remnawave.Client ${{ steps.version.outputs.version }}"
