name: Update Remnawave API

# Checks docs.rw daily for a new OpenAPI document, regenerates the client and opens a PR.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download spec and regenerate
        run: ./scripts/generate.sh --download

      - name: Build and test
        run: dotnet test -c Release

      - name: Read version
        id: version
        run: echo "version=$(cat spec/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update/remnawave-api
          commit-message: "Update to Remnawave API v${{ steps.version.outputs.version }}"
          title: "Update to Remnawave API v${{ steps.version.outputs.version }}"
          body: |
            Regenerated from https://cdn.docs.rw/docs/openapi.json.

            Review `spec/remnawave-openapi.processed.json` for model changes, then merge and tag `v${{ steps.version.outputs.version }}` to publish.
          labels: dependencies
